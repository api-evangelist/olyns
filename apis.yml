aid: olyns
name: Olyns
description: >-
  Olyns is a Silicon Valley company, founded in 2019, that operates an AI-powered reverse
  vending and retail media network built around the Olyns Cube — a self-serve kiosk that
  accepts beverage containers and rigid plastic packaging, uses computer vision to identify
  and sort each item at the point of deposit, pays the consumer their deposit (CRV) refund
  electronically, and carries a 55-inch screen that Olyns sells as digital-out-of-home
  advertising inventory. Cubes are placed with supermarkets, big-box retailers, pharmacies
  and gas stations, and the advertising side is sold both directly and programmatically
  through Screenverse. Olyns ships consumer and operations software — a mobile/web wallet
  app at app.olyns.com and a self-service ad portal at ads.olyns.com — but publishes no
  public API, developer portal, SDK or machine-readable contract of any kind.
